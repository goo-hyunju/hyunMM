[project]
name = "hyunmm-service"
version = "0.1.0"
description = "hyunMM AI DAW 로컬 AI 서비스 — 생성(오디오/MIDI), 분석, 모델 관리"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# AI 추론용 무거운 의존성. 설치 전 각 모델의 라이선스(상업적 사용 가능 여부)를 확인한다.
# MusicGen 계열 실행 후보: transformers(facebook/musicgen-*) 또는 audiocraft.
ai = [
    "torch>=2.4",
    "transformers>=4.44",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
